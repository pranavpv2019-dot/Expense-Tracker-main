{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="bg-image"></div>
<div class="bg-text">
    <div id="layoutAuthentication">
        <div id="layoutAuthentication_content">
            <main>
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-5">
                            <div class="card shadow-lg border-0 rounded-lg mt-5">
                                <div class="card-header">
                                    <h3 class="text-center font-weight-light my-4">
                                        Expense Tracker - Login
                                    </h3>
                                </div>
                                <div class="card-body">
                                    <form action="{% url 'handlelogin' %}" method="post">
                                        {% csrf_token %}
                                        <div class="form-group">
                                            <label for="loginuname">Username</label>
                                            <input class="form-control py-4" id="loginuname" name="loginuname" type="text" placeholder="Enter username" required/>
                                        </div>
                                        <div class="form-group">
                                            <label for="loginpassword1">Password</label>
                                            <input class="form-control py-4" id="loginpassword1" name="loginpassword1" type="password" placeholder="Enter password" required/>
                                        </div>
                                        <div class="form-group mt-4">
                                            <button type="submit" class="btn btn-primary w-100">Login</button>
                                        </div>
                                    </form>
                                </div>
                                <div class="card-footer text-center">
                                    <div class="small"><a href="{% url 'register' %}">Need an account? Sign up!</a></div>
                                    <div class="small"><a href="{% url 'reset_password' %}">Forgot Password?</a></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>
{% endblock body %}
