<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .button-group button, .button-group label {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }
        .button-group button:hover, .button-group label:hover {
            background-color: #45a049;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Expense Tracker Dashboard</h1>

    <div class="button-group">

        <!-- Add Expense/Income Button -->
        <a href="{% url 'add_expense' %}">
            <button type="button" class="btn-expense">
                <i class="fas fa-plus"></i> Add Expense or Income
            </button>
        </a>

        <!-- Add Recurring Expense Button -->
        <a href="{% url 'add_recurring' %}">
            <button type="button" class="btn-recurring">
                <i class="fas fa-sync-alt"></i> Add Recurring Expense
            </button>
        </a>

        <!-- OCR / Receipt Upload Button -->
        <form action="{% url 'ocr' %}" method="post" enctype="multipart/form-data" style="display:inline;">
            {% csrf_token %}
            <label for="bill_image" class="btn-ocr">
                <i class="fas fa-camera"></i> Scan Receipt / OCR
            </label>
            <input type="file" id="bill_image" name="bill_image" accept="image/*" onchange="this.form.submit()">
        </form>

    </div>

</body>
</html>
